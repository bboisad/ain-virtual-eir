# This manifest expects virtual_eir/ to be the Git repository root.
# If the repository contains the enclosing delivery folder, set rootDir: virtual_eir
# and select virtual_eir/render.yaml as the Blueprint path in Render.
services:
  - type: web
    name: ain-virtual-eir
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install --disable-pip-version-check -r requirements.txt
    startCommand: python -m streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: EIR_STORAGE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: eir-files
      - key: EIR_DEMO_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
